<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Jiahao Lu (Coconut) — computer architecture and operating systems. An interactive terminal-style homepage." />
    <meta name="theme-color" content="#f3f5f2" />
    <title>Coconut@homepage:~</title>
    <link rel="canonical" href="https://lujhcoconut.github.io/" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥥</text></svg>" />
    <link rel="stylesheet" href="./assets/terminal/terminal.css" />
    <script>
      try {
        const saved = localStorage.getItem('coconut-terminal-theme');
        const preferred = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = saved || preferred;
      } catch (_) { /* The light stylesheet remains available without storage. */ }
    </script>
  </head>
  <body>
    <div id="app">
      <section class="terminal-window" aria-label="Interactive personal homepage">
        <header class="terminal-header">
          <div class="titlebar">
            <div class="window-dots" aria-hidden="true">
              <span></span><span></span><span></span>
            </div>
            <span class="window-title">coconut@homepage: ~</span>
            <button class="theme-toggle" type="button" data-command="theme" aria-label="Toggle color theme">theme</button>
          </div>
          <nav class="quick-commands" aria-label="Quick navigation">
            <span class="quick-label" aria-hidden="true">run:</span>
            <button type="button" data-command="about">about</button>
            <button type="button" data-command="publications">publications</button>
            <button type="button" data-command="presentations">presentations</button>
            <button type="button" data-command="recent">recent</button>
            <button type="button" data-command="notes">notes</button>
            <button type="button" data-command="essays">essays</button>
            <button type="button" data-command="contact">contact</button>
            <button type="button" data-command="help">help</button>
          </nav>
        </header>

        <main class="terminal-body" id="terminal-body">
          <div id="terminal-output" class="terminal-output" role="log" aria-live="polite" aria-relevant="additions"></div>
          <form id="terminal-form" class="terminal-form" autocomplete="off">
            <label class="prompt" for="terminal-input" aria-label="Terminal prompt">
              <span class="prompt-user">coconut</span><span class="prompt-dim">@</span><span class="prompt-host">homepage</span><span class="prompt-dim">:~$</span>
            </label>
            <input
              id="terminal-input"
              name="command"
              type="text"
              inputmode="text"
              autocapitalize="off"
              autocomplete="off"
              spellcheck="false"
              aria-label="Terminal command input"
              aria-describedby="terminal-shortcuts"
              placeholder="type help"
            />
            <span class="input-cursor" aria-hidden="true"></span>
          </form>
        </main>

        <footer class="terminal-footer">
          <span id="terminal-shortcuts">↑↓ history&nbsp;&nbsp;·&nbsp;&nbsp;Tab complete&nbsp;&nbsp;·&nbsp;&nbsp;Ctrl+L clear</span>
          <span class="footer-links">
            <a href="https://github.com/LujhCoconut" target="_blank" rel="noreferrer noopener">github</a>
            <a href="./classic.html">classic mode</a>
          </span>
        </footer>
      </section>

      <noscript>
        <section class="no-script-card">
          <h1>Jiahao Lu / 卢佳豪</h1>
          <p>M.S. student in Artificial Intelligence at Xiamen University, working on computer architecture and operating systems.</p>
          <p>Email: <a href="mailto:lujhcoconut@foxmail.com">lujhcoconut@foxmail.com</a></p>
          <p>GitHub: <a href="https://github.com/LujhCoconut">github.com/LujhCoconut</a></p>
          <p>Enable JavaScript for the interactive terminal, or return to the <a href="./classic.html">classic homepage</a>.</p>
        </section>
      </noscript>
    </div>

    <script type="module" src="./assets/terminal/terminal.js"></script>
  </body>
</html>
